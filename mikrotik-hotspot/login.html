<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KijaniLink Hotspot Gateway — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #0d231b 0%, #08131e 45%, #02060d 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 25px rgba(16, 185, 129, 0.2);
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 18px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16,185,129,0.5);
      font-size: 24px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; background: linear-gradient(90deg, #34d399, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .input-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 14px 16px;
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      transition: border 0.2s;
    }
    .input-box:focus { border-color: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.3); }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      padding: 14px;
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(16,185,129,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(16,185,129,0.6); }
    .portal-link {
      display: inline-block;
      margin-top: 18px;
      color: #34d399;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="logo">🌿</div>
    <h1>KijaniLink</h1>
    <p>Unganisha. Lipa. Furahia — Ultra-Fast WiFi</p>

    <!-- MikroTik Hotspot Form -->
    <form name="login" action="$(link-login-only)" method="post" $(if chap-id)onSubmit="return doLogin()"$(endif)>
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      
      <input class="input-box" name="username" type="text" value="$(username)" placeholder="Phone Number / Voucher Code" required />
      <input class="input-box" name="password" type="password" placeholder="M-Pesa PIN / Voucher Code" />
      
      <button class="btn-submit" type="submit">Connect to Internet</button>
    </form>

    <a class="portal-link" href="http://192.168.88.1:3000">Buy Package via M-Pesa on Portal →</a>
  </div>
</body>
</html>
