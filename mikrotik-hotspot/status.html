<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KijaniLink Hotspot — Connected Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #0d231b 0%, #08131e 45%, #02060d 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 25px rgba(16, 185, 129, 0.2);
      text-align: center;
    }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(16,185,129,0.2); color: #34d399; margin-bottom: 16px; border: 1px solid rgba(52,211,153,0.3); }
    h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; }
    .stat-label { color: #94a3b8; }
    .stat-value { font-weight: 600; color: #fff; font-family: monospace; }
    .btn-logout { width: 100%; margin-top: 20px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 12px; border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="badge">● ONLINE & ACTIVE</div>
    <h1>KijaniLink High-Speed Session</h1>
    <div style="margin: 20px 0; text-align: left;">
      <div class="stat-row"><span class="stat-label">User / Phone</span><span class="stat-value">$(username)</span></div>
      <div class="stat-row"><span class="stat-label">IP Address</span><span class="stat-value">$(ip)</span></div>
      <div class="stat-row"><span class="stat-label">Data Downloaded</span><span class="stat-value">$(bytes-out-nice)</span></div>
      <div class="stat-row"><span class="stat-label">Data Uploaded</span><span class="stat-value">$(bytes-in-nice)</span></div>
      <div class="stat-row"><span class="stat-label">Connected Time</span><span class="stat-value">$(uptime)</span></div>
      <div class="stat-row"><span class="stat-label">Time Remaining</span><span class="stat-value">$(session-time-left)</span></div>
    </div>
    <form action="$(link-logout)" name="logout" onSubmit="return openLogout()">
      <button class="btn-logout" type="submit">Disconnect Session</button>
    </form>
  </div>
</body>
</html>
