<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KijaniLink Hotspot — Logged Out</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #0d231b 0%, #08131e 45%, #02060d 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .btn-login { display: block; width: 100%; background: linear-gradient(135deg, #10b981, #059669); text-decoration: none; padding: 14px; border-radius: 16px; color: #fff; font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="glass-card">
    <h1>Session Disconnected</h1>
    <p>You have successfully logged out of KijaniLink WiFi. Thank you for browsing with us!</p>
    <a href="$(link-login)" class="btn-login">Log In Again</a>
  </div>
</body>
</html>
